### DEV Profile - Hot Reload Configuration

### Disable FreeMarker template cache for hot reload
spring.freemarker.cache=false
spring.freemarker.prefer-file-system-access=true

### Disable Thymeleaf cache (if used)
spring.thymeleaf.cache=false

### Static resources - load from source directory directly
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

### DevTools settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

### Additional paths to watch for restart
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static

### Logging for dev
logging.level.com.xxl.job=INFO
